# Proxy cho compose.dev.yml: giống route production /herox/ → herox:3180 cho API,
# còn file tĩnh client do nginx phục vụ (server HeroX hiện chưa có route file tĩnh).
server {
  listen 80;

  location /herox/api/ {
    proxy_pass http://herox:3180;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /herox/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /herox/index.html;
  }
}
