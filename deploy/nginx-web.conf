# Production: nginx chỉ phục vụ client HeroX (file tĩnh) ở /herox/.
# Caddy dùng chung trên VPS chuyển /herox/api/* thẳng vào herox:3180, phần còn lại của /herox/ vào đây.
server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;

  location = /herox {
    return 301 /herox/;
  }

  # File Vite đặt tên theo hash nội dung: không bao giờ đổi nên cache lâu.
  location /herox/assets/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Trang, service worker, manifest, map, sprite không hash: luôn hỏi lại để bản deploy mới thắng ngay.
  location /herox/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /herox/index.html;
  }
}
